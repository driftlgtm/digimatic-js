<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>digimatic-js — demo</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap"
		/>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--bg: #0a0c0f;
				--surface: #12161c;
				--border: #1e242e;
				--accent: #00e5a0;
				--accent2: #0077ff;
				--warn: #ff6b35;
				--text: #c8d4e0;
				--muted: #4a5568;
				--mono: "JetBrains Mono", monospace;
				--sans: "Syne", sans-serif;
			}

			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--sans);
				min-height: 100vh;
				padding: 2rem;
				display: grid;
				grid-template-rows: auto 1fr;
				gap: 2rem;
			}

			/* ── Header ── */
			header {
				display: flex;
				align-items: center;
				gap: 1.5rem;
				border-bottom: 1px solid var(--border);
				padding-bottom: 1.5rem;
			}
			header h1 {
				font-size: 1.5rem;
				font-weight: 800;
				letter-spacing: -0.02em;
				color: #fff;
			}
			header h1 span {
				color: var(--accent);
			}
			.badge {
				font-family: var(--mono);
				font-size: 0.65rem;
				background: var(--border);
				color: var(--muted);
				padding: 0.2em 0.6em;
				border-radius: 4px;
				letter-spacing: 0.05em;
			}
			.support-ok {
				color: var(--accent);
			}
			.support-no {
				color: var(--warn);
			}

			/* ── Main grid ── */
			main {
				display: grid;
				grid-template-columns: 280px 1fr;
				grid-template-rows: auto 1fr;
				gap: 1.5rem;
			}

			/* ── Sidebar ── */
			aside {
				grid-row: 1 / 3;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			.card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 1.25rem;
			}
			.card-title {
				font-size: 0.7rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--muted);
				margin-bottom: 1rem;
			}

			button {
				display: block;
				width: 100%;
				padding: 0.75rem 1rem;
				border-radius: 7px;
				border: none;
				cursor: pointer;
				font-family: var(--sans);
				font-size: 0.85rem;
				font-weight: 700;
				letter-spacing: 0.02em;
				transition:
					opacity 0.15s,
					transform 0.1s;
			}
			button:active {
				transform: scale(0.97);
			}
			button:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}

			.btn-primary {
				background: var(--accent);
				color: #000;
				margin-bottom: 0.6rem;
			}
			.btn-danger {
				background: transparent;
				border: 1px solid var(--warn);
				color: var(--warn);
			}

			/* ── Device list ── */
			#device-list {
				display: flex;
				flex-direction: column;
				gap: 0.6rem;
			}

			.device-item {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				padding: 0.6rem 0.8rem;
				background: var(--bg);
				border: 1px solid var(--border);
				border-radius: 7px;
				font-family: var(--mono);
				font-size: 0.78rem;
			}
			.dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 8px var(--accent);
				flex-shrink: 0;
				animation: pulse 2s ease-in-out infinite;
			}
			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.4;
				}
			}
			.device-id {
				color: #fff;
				flex: 1;
			}
			.device-unit {
				color: var(--muted);
				font-size: 0.7rem;
			}

			.empty-state {
				font-family: var(--mono);
				font-size: 0.75rem;
				color: var(--muted);
				text-align: center;
				padding: 1rem 0;
			}

			/* ── Measurement display ── */
			#readings-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
				gap: 1rem;
				align-content: start;
			}

			.reading-card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 1.25rem;
				position: relative;
				overflow: hidden;
				transition: border-color 0.2s;
			}
			.reading-card.fresh {
				border-color: var(--accent);
			}
			.reading-card::before {
				content: "";
				position: absolute;
				inset: 0;
				background: linear-gradient(
					135deg,
					rgba(0, 229, 160, 0.04) 0%,
					transparent 60%
				);
				pointer-events: none;
			}

			.reading-label {
				font-size: 0.65rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--muted);
				margin-bottom: 0.75rem;
			}

			.reading-value {
				font-family: var(--mono);
				font-size: 2.4rem;
				font-weight: 700;
				color: var(--accent);
				line-height: 1;
				letter-spacing: -0.02em;
				transition: color 0.15s;
			}
			.reading-value .unit {
				font-size: 1rem;
				color: var(--muted);
				margin-left: 0.25rem;
				font-weight: 400;
			}

			.reading-meta {
				display: flex;
				gap: 0.5rem;
				margin-top: 0.6rem;
				flex-wrap: wrap;
			}
			.tag {
				font-family: var(--mono);
				font-size: 0.6rem;
				padding: 0.15em 0.5em;
				border-radius: 3px;
				font-weight: 700;
				letter-spacing: 0.05em;
			}
			.tag-hold {
				background: rgba(0, 119, 255, 0.2);
				color: var(--accent2);
			}
			.tag-neg {
				background: rgba(255, 107, 53, 0.2);
				color: var(--warn);
			}

			/* ── Event log ── */
			#log {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 1rem 1.25rem;
				font-family: var(--mono);
				font-size: 0.72rem;
				overflow-y: auto;
				max-height: 240px;
				display: flex;
				flex-direction: column-reverse; /* newest on top */
				gap: 0.25rem;
			}

			.log-line {
				display: flex;
				gap: 1rem;
				opacity: 0;
				animation: fadein 0.2s forwards;
			}
			@keyframes fadein {
				to {
					opacity: 1;
				}
			}

			.log-time {
				color: var(--muted);
				flex-shrink: 0;
			}
			.log-event {
				flex-shrink: 0;
				width: 80px;
			}
			.log-event.ev-measurement {
				color: var(--accent);
			}
			.log-event.ev-connect {
				color: var(--accent2);
			}
			.log-event.ev-disconnect {
				color: var(--warn);
			}
			.log-event.ev-error {
				color: var(--warn);
			}
			.log-body {
				color: var(--text);
			}

			/* ── Simulator (for browsers without real HW) ── */
			#simulator {
				margin-top: auto;
				padding-top: 1rem;
				border-top: 1px solid var(--border);
			}
			#simulator p {
				font-size: 0.7rem;
				color: var(--muted);
				margin-bottom: 0.75rem;
				line-height: 1.5;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>digimatic<span>-js</span></h1>
			<span class="badge">v1.0.0</span>
			<span id="support-badge" class="badge">checking…</span>
		</header>

		<main>
			<!-- Sidebar -->
			<aside>
				<div class="card">
					<div class="card-title">Devices</div>
					<button class="btn-primary" id="btn-connect">
						＋ Connect device
					</button>
					<button class="btn-danger" id="btn-disconnect-all" disabled>
						Disconnect all
					</button>
					<div id="device-list">
						<div class="empty-state">No devices connected</div>
					</div>
				</div>

				<div class="card" id="simulator">
					<div class="card-title">Simulator</div>
					<p>
						No physical gauge? Simulate a device emitting random
						measurements.
					</p>
					<button
						class="btn-primary"
						id="btn-simulate"
						style="background: var(--accent2); color: #fff"
					>
						▶ Add simulated device
					</button>
				</div>
			</aside>

			<!-- Readings -->
			<section>
				<div id="readings-grid">
					<div
						class="empty-state"
						id="readings-empty"
						style="grid-column: 1/-1; padding: 2rem 0"
					>
						Connect a device to see live measurements
					</div>
				</div>
			</section>

			<!-- Log -->
			<section style="grid-column: 2">
				<div
					class="card-title"
					style="
						font-size: 0.65rem;
						font-weight: 700;
						letter-spacing: 0.12em;
						text-transform: uppercase;
						color: var(--muted);
						margin-bottom: 0.5rem;
					"
				>
					Event log
				</div>
				<div id="log"></div>
			</section>
		</main>

		<script type="importmap">
			{
				"imports": {
					"@lgtm/digimatic-js": "https://esm.sh/jsr/@lgtm/digimatic-js"
				}
			}
		</script>
		<script type="module" src="demo.js"></script>
	</body>
</html>
